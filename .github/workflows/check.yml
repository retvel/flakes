name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Only whether the secret is set; the token itself goes to the push step.
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch too, for macOS to compare against.
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # On macOS outside main, only the checks whose derivation differs from
      # the base branch's are built: main's own run already built the rest.
      # Finding them evaluates every macOS check. Most updates change none
      # (a Linux-only package), which skips the store below as well.
      - name: Find what differs from the base branch
        id: changed
        if: runner.os == 'macOS' && github.ref != 'refs/heads/main'
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          changed="$(lib/changed-checks.sh "$(nix eval --raw --impure --expr builtins.currentSystem)" "$BASE")"
          echo "To build: ${changed:-nothing}"
          echo "checks=$(echo $changed)" >>"$GITHUB_OUTPUT"
      # macOS packages are mostly app downloads that no binary cache holds:
      # keep the Nix store between runs instead of fetching them each time.
      # The key changes with any package; a run restores the newest store
      # saved before it, and the store is trimmed to 4G before saving.
      - if: runner.os == 'macOS' && (steps.changed.conclusion == 'skipped' || steps.changed.outputs.checks != '')
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/*.nix', 'pkgs/**/hashes.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-macos: 4G
      # Pull from ret.cachix.org, which is public: no token needed.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ret
          skipPush: true
      # Each runner evaluates and builds its own system only: Linux checks
      # Linux, macOS checks macOS. Not --no-build: its read-only store breaks
      # filtered sources read during evaluation (hermes-agent's uv.lock).
      # --keep-going reports every failing package, not just the first.
      - name: Evaluate and build this runner's system
        if: steps.changed.conclusion == 'skipped'
        run: nix flake check --keep-going -L
      - name: Build the checks that differ from the base branch
        if: steps.changed.outputs.checks != ''
        env:
          CHECKS: ${{ steps.changed.outputs.checks }}
        run: |
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          nix build --no-link --keep-going -L $(printf ".#checks.$system.\"%s\" " $CHECKS)
      # Only hermes-agent's runtime closure, and only from main: builds of
      # pull requests and update/<name> branches never reach the cache.
      # Paths already on cache.nixos.org are skipped.
      - name: Push hermes-agent to Cachix
        if: env.HAS_CACHIX == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && runner.os == 'Linux' && runner.arch == 'X64'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix build .#hermes-agent --no-link --print-out-paths | cachix push ret

  # An update/<name> branch that update.yml proposed and every system above
  # built: merge its pull request, unless the branch moved on since this run
  # started. Only a dispatch from update.yml (or someone with write access)
  # runs this, never a pull_request event. This token's merge starts no
  # workflow, so check.yml is started on main for its Cachix push.
  merge:
    needs: check
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/update/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # The token goes only to this step, as the secrets above do.
      - name: Merge the update's pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        # The branch is deleted through the API: gh pr merge --delete-branch
        # also looks for a local checkout, which this job has none of.
        # pull_request runs still waiting for approval at this commit are
        # deleted first (lib/update-all.sh deletes those it sees): merging
        # would fail them as expired, and GitHub would mail the failure.
        run: |
          if [ "$(gh pr view "$BRANCH" --json state -q .state)" != OPEN ]; then
            echo "$BRANCH: no open pull request"; exit 0
          fi
          for id in $(gh api "repos/$GH_REPO/actions/runs?event=pull_request&head_sha=$SHA&status=action_required" -q '.workflow_runs[].id' || true); do
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" ||
              echo "::warning::could not delete run $id, which waits for approval"
          done
          gh pr merge "$BRANCH" --merge --match-head-commit "$SHA"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" >/dev/null
          gh workflow run check.yml --ref main
