name: Update

on:
  schedule:
    # Twice a day, off the top of the hour, where GitHub delays or drops
    # scheduled runs the most.
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to update (space-separated, empty for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Pull from and push to retvel.cachix.org once the token secret exists.
      - uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: retvel
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Update packages
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for script in pkgs/*/update.sh; do
            name="$(basename "$(dirname "$script")")"
            if [ -n "${PACKAGES:-}" ] && [[ " $PACKAGES " != *" $name "* ]]; then continue; fi
            "$script"
            git diff --quiet -- "pkgs/$name" && continue
            version="$(jq -r .version "pkgs/$name/hashes.json" 2>/dev/null || echo new)"
            # Build every x86_64-linux package, so packages built on this one
            # (e.g. nullclaw-nightly on nullclaw) are checked too.
            if nix flake check --all-systems --no-build && nix flake check -L; then
              git commit -m "Update $name to v$version" -- "pkgs/$name"
            else
              echo "::error::$name failed to build after update"
              git checkout -- "pkgs/$name"
            fi
          done
          git push
