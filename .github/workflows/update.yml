name: Update

on:
  schedule:
    # Twice a day, off the top of the hour, where GitHub delays or drops
    # scheduled runs the most.
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to update (space-separated, empty for all; nixpkgs for the nixpkgs input)"
        required: false
        default: ""

# One run at a time, so a manual run waits for a scheduled one instead of
# racing its push.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # To start check.yml on update/<name>: pushes made with this token start
  # no workflows, but a dispatch does.
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  # These run as root, filter the network, or are agents acting with the
  # user's access: their updates go through a pull request (branch
  # update/<name>), which check.yml merges once every system builds it,
  # instead of straight to main from this Linux-only run.
  REVIEW: "1mcp codex hermes-agent littlesnitch muxin nullclaw opencode pi rayfish"

jobs:
  # Every package that builds on Linux, and nixpkgs weekly. See
  # lib/update-all.sh.
  update:
    runs-on: ubuntu-latest
    env:
      # Only whether the secret is set; the token itself goes to the push step.
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the rebase before the push always finds its base.
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Pull from ret.cachix.org, which is public: no token needed.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ret
          skipPush: true

      - name: Update packages
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
          UPDATE_SYSTEM: x86_64-linux
        run: lib/update-all.sh

      # Only hermes-agent's runtime closure, as main now has it; paths already
      # on cache.nixos.org are skipped. Runs after a failed update too.
      - name: Push hermes-agent to Cachix
        if: ${{ !cancelled() && env.HAS_CACHIX == 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix build .#hermes-agent --no-link --print-out-paths | cachix push ret

  # The packages that build only on macOS, built there before they land, on
  # top of what the Linux job pushed.
  update-darwin:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Keeps the Nix store between runs, as in check.yml.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/*.nix', 'pkgs/**/hashes.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-macos: 4G
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ret
          skipPush: true
      # macOS ships bash 3.2 and BSD tools; the update scripts run with
      # nixpkgs' bash and GNU tools, as on Linux.
      - name: Update packages
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
          UPDATE_SYSTEM: aarch64-darwin
        run: >-
          nix shell --inputs-from . nixpkgs#bash nixpkgs#coreutils
          nixpkgs#gnugrep nixpkgs#gnused --command lib/update-all.sh
