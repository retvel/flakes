name: Webapps

# Builds every pkgs/webapp-*/ with Pake on Apple Silicon and publishes the dmgs
# in one release per pake-cli version, "Pake (X.Y.Z)" tagged pake-vX.Y.Z, then
# pins each in its webapp's hashes.json. An asset's name carries a hash of its
# pake.json + icon.png, so a config change adds an asset to the release (old
# pins keep working), a new pake-cli makes a new release with every webapp, and
# nothing changed builds nothing.

on:
  # Daily, off the top of the hour, to pick up new pake-cli releases.
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths:
      - "pkgs/webapp-*/pake.json"
      - "pkgs/webapp-*/icon.png"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webapp
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pake: ${{ steps.plan.outputs.pake }}
      tag: ${{ steps.plan.outputs.tag }}
      webapps: ${{ steps.plan.outputs.webapps }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          pake="$(npm view pake-cli version)"
          tag="pake-v$pake"
          webapps='[]'
          for dir in pkgs/webapp-*/; do
            name="$(basename "$dir")"
            product="$(jq -r .name "$dir/pake.json")"
            config="$(cat "$dir/pake.json" "$dir/icon.png" | sha256sum | cut -c1-8)"
            asset="$product-$config-aarch64.dmg"
            [ "$(jq -r '.tag + "/" + .asset' "$dir/hashes.json")" != "$tag/$asset" ] || continue
            webapps="$(jq -c --arg n "$name" --arg a "$asset" \
              '. + [{name: $n, asset: $a}]' <<<"$webapps")"
          done
          # Made here, not by the parallel builds, which would race to create it.
          if [ "$webapps" != '[]' ] && ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Pake ($pake)" \
              --notes "pkgs/webapp-* built with pake-cli $pake for Apple Silicon. Each dmg is named <app>-<hash of its pake.json + icon.png>-aarch64.dmg."
          fi
          echo "pake=$pake" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "webapps=$webapps" >> "$GITHUB_OUTPUT"
          echo "pake-cli $pake; to build: $webapps"

  build:
    needs: plan
    if: needs.plan.outputs.webapps != '[]'
    # Apple Silicon.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.webapps) }}
    env:
      GH_TOKEN: ${{ github.token }}
      PAKE: ${{ needs.plan.outputs.pake }}
      TAG: ${{ needs.plan.outputs.tag }}
      NAME: ${{ matrix.name }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and publish
        run: |
          # Left over from a run whose pin step failed: only the pin is missing.
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$ASSET"; then
            echo "$ASSET already published"
            exit 0
          fi
          npm install -g "pake-cli@$PAKE"
          cd "pkgs/$NAME"
          pake --config pake.json --icon "$PWD/icon.png" --json > "$RUNNER_TEMP/result.json"
          dmg="$(jq -r '.outputs[] | select(.format == "dmg") | .path' "$RUNNER_TEMP/result.json" | head -n1)"
          [ -n "$dmg" ] || { cat "$RUNNER_TEMP/result.json"; exit 1; }
          cp "$dmg" "$RUNNER_TEMP/$ASSET"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET"

  pin:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.webapps != '[]' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PAKE: ${{ needs.plan.outputs.pake }}
      TAG: ${{ needs.plan.outputs.tag }}
      WEBAPPS: ${{ needs.plan.outputs.webapps }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Pin published releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          jq -c '.[]' <<<"$WEBAPPS" | while read -r webapp; do
            name="$(jq -r .name <<<"$webapp")"
            asset="$(jq -r .asset <<<"$webapp")"
            # Its build failed; leave the old pin.
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$asset" \
              || { echo "::error::$asset was not published"; continue; }
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset"
            hash="$(nix store prefetch-file --json "$url" | jq -r .hash)"
            jq -n --arg v "$PAKE" --arg t "$TAG" --arg a "$asset" --arg h "$hash" \
              '{version: $v, tag: $t, asset: $a, hashes: {"aarch64-darwin": $h}}' > "pkgs/$name/hashes.json"
            git commit -m "Update $name to v$PAKE" -- "pkgs/$name/hashes.json"
          done
          git pull --rebase
          git push
